# One-shot release request: tag the vetted master revision and invoke
# the existing Linux release workflow on that tag. This file is branch-only.
name: Request hakuX-lr 0.25.0 release
on:
  push:
    branches:
      - release/linux-v0.25.0

permissions:
  contents: write
  actions: write

jobs:
  dispatch-release:
    if: github.repository == 'portare-ch/hakuX-lr'
    runs-on: ubuntu-latest
    steps:
      - name: Tag release source and dispatch the standard build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: linux-v0.25.0
          SOURCE_SHA: 376bd7d8375a4a235c831f2bddc0d7212e15d1bd
        run: |
          set -euo pipefail
          # The release tag does not exist yet. Fail rather than overwrite it.
          gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SOURCE_SHA" > /dev/null
          # GITHUB_TOKEN-created tags do not start push workflows. Dispatch the
          # existing workflow explicitly against the new tag instead.
          gh workflow run linux.yml --ref "$TAG" --repo "$GH_REPO"
