# SPDX-License-Identifier: GPL-2.0-or-later
# Publish this version from its release commit after all three builds pass.
name: hakuX-lr release v0.35.1

on:
  push:
    branches: ['release/publish-v0.35.1']

concurrency:
  group: hakux-lr-release-v0.35.1
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: '0.35.1'
  RELEASE_TAG: linux-v0.35.1
  RELEASE_COMMIT: 59a7c77dd27df739a8062c57988f47d7b43a5bcc

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}

      - uses: actions/cache@v4
        with:
          path: build/deps
          key: linux-deps-${{ hashFiles('tools/native/linux-deps.json') }}

      - name: Image
        run: docker build --tag hakux-lr-linux --file tools/native/Dockerfile.linux tools/native

      # root in the container, the checkout the runner's: git is told it's safe
      - name: Build and check
        run: |
          docker run --rm --volume "$PWD:/src" --workdir /src \
            --env JOBS=4 --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0='*' \
            hakux-lr-linux sh tools/native/linux-ci.sh "${{ env.RELEASE_VERSION }}"

      - uses: actions/upload-artifact@v4
        with:
          name: hakux-lr-${{ env.RELEASE_VERSION }}-aarch64
          path: |
            build/package/hakux-lr-${{ env.RELEASE_VERSION }}-aarch64.tar.gz
            build/package/hakux-lr-${{ env.RELEASE_VERSION }}-aarch64.tar.gz.sha256
          if-no-files-found: error

  # Build and test the x86-64 KVM core and DSP JIT in the amd64 image.
  build-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}

      - uses: actions/cache@v4
        with:
          path: build/deps
          key: linux-deps-${{ hashFiles('tools/native/linux-deps.json') }}

      - name: Image
        run: docker build --tag hakux-lr-linux --file tools/native/Dockerfile.linux tools/native

      # the KVM backend's guest CPU (#56): the runner's /dev/kvm, handed in
      - name: Build and check
        run: |
          docker run --rm --volume "$PWD:/src" --workdir /src --device /dev/kvm \
            --env JOBS=4 --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0='*' \
            hakux-lr-linux sh tools/native/linux-ci-x86_64.sh "${{ env.RELEASE_VERSION }}"

      - uses: actions/upload-artifact@v4
        with:
          name: hakux-lr-${{ env.RELEASE_VERSION }}-x86_64
          path: |
            build/package/hakux-lr-${{ env.RELEASE_VERSION }}-x86_64.tar.gz
            build/package/hakux-lr-${{ env.RELEASE_VERSION }}-x86_64.tar.gz.sha256
          if-no-files-found: error

  # Experimental Android core for RetroArch: build with the pinned NDK r29.
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}

      - uses: actions/cache@v4
        with:
          path: build/deps
          key: linux-deps-${{ hashFiles('tools/native/linux-deps.json') }}

      - name: Fetch pinned dependencies
        run: python3 tools/native/linux-deps.py

      - name: Build Android ARM64 core
        env:
          ANDROID_NDK: /usr/local/lib/android/sdk/ndk/29.0.14206865
        run: |
          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          JOBS=4 sh tools/native/android-libretro.sh "${{ env.RELEASE_VERSION }}"

      - uses: actions/upload-artifact@v4
        with:
          name: hakux-lr-${{ env.RELEASE_VERSION }}-android-arm64
          path: |
            build/package/hakux-lr-${{ env.RELEASE_VERSION }}-android-arm64.zip
            build/package/hakux-lr-${{ env.RELEASE_VERSION }}-android-arm64.zip.sha256
          if-no-files-found: error

  release:
    needs: [build, build-x86_64, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}

      - uses: actions/download-artifact@v4
        with:
          pattern: hakux-lr-${{ env.RELEASE_VERSION }}-*
          merge-multiple: true
          path: dist

      - name: Verify archives and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          for suffix in aarch64.tar.gz x86_64.tar.gz android-arm64.zip; do
            archive="dist/hakux-lr-$RELEASE_VERSION-$suffix"
            test -s "$archive"
            test -s "$archive.sha256"
          done
          set -- dist/*
          test "$#" -eq 6
          (cd dist && sha256sum --check --strict *.sha256)
          test -z "$(git ls-remote origin "refs/tags/$RELEASE_TAG")"
          python3 tools/native/linux-release-notes.py "$RELEASE_VERSION" "$RELEASE_COMMIT" linux-v0.35.0 "$RUN_URL" > notes.md
          gh release create "$RELEASE_TAG" "$@" --target "$RELEASE_COMMIT" \
            --title "hakuX-lr $RELEASE_VERSION" --notes-file notes.md --latest
