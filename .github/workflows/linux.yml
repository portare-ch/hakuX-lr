# Test the GitLab job commands in their pinned images before registration.
name: Libretro x86-64 preflight

on:
  push:
    branches: [ci/libretro-linux-x64-preflight]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f459dff1b552ed9e724dd5b2af6072fbf798c855
      - name: Run both GitLab jobs without KVM
        run: |
          if ! python3 -c 'import yaml' >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y python3-yaml
          fi
          python3 - <<'PY'
          from pathlib import Path
          from string import Template
          from subprocess import check_output, run
          import yaml

          pipeline = yaml.load(Path(".gitlab-ci.yml").read_text(), Loader=yaml.BaseLoader)
          checkout = check_output(["git", "rev-parse", "--short=8", "HEAD"], text=True).strip()
          for name in ("prepare-linux-x64-sysroot", "libretro-build-linux-x64"):
              job = pipeline[name]
              environment = {
                  "CI_PROJECT_DIR": "/src",
                  "CI_COMMIT_SHORT_SHA": checkout,
                  "GIT_CONFIG_COUNT": "1",
                  "GIT_CONFIG_KEY_0": "safe.directory",
                  "GIT_CONFIG_VALUE_0": "/src",
              }
              for key, value in job.get("variables", {}).items():
                  environment[key] = Template(value).substitute(environment)
              docker = ["docker", "run", "--rm", "--volume", f"{Path.cwd()}:/src", "--workdir", "/src"]
              for key, value in environment.items():
                  docker.extend(["--env", f"{key}={value}"])
              script = "\n".join(["test ! -e /dev/kvm", *job["before_script"], *job["script"]])
              print(f"Running {name} in {job['image']}", flush=True)
              run([*docker, job["image"], "bash", "-ex", "-c", script], check=True)
          assert Path("hakux-lr_libretro.so").stat().st_size > 0
          cache = Path("build/libretro-linux-x64/CMakeCache.txt").read_text()
          for option in ("HAKUX_CPU:STRING=kvm", "HAKUX_DSP_JIT:BOOL=ON",
                         "HAKUX_BUILD_TESTS:BOOL=OFF", "HAKUX_LR_END_PROCESS:BOOL=OFF"):
              assert option in cache, option
          print("PASS: hakux-lr_libretro.so built and verified without /dev/kvm")
          PY
