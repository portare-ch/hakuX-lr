# The libretro core for PortareOS (aarch64 Linux): built and checked by
# tools/native/linux-ci.sh in the pinned image (tools/native/Dockerfile.linux)
# on every push and pull request, the package kept as the run's artifact. A
# linux-v<version> tag also publishes it as that release, with its
# CHANGELOG.md section as the notes (tools/native/linux-release-notes.py); a
# version with a suffix (0.12.0-exp.1) is a pre-release, not the latest.
# A pull request from this repository's own branches has its push's run; one
# from a fork is built on its own.
name: Linux

on:
  push:
    branches: ['**']
    tags: ['linux-v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/linux-v*) v=${GITHUB_REF_NAME#linux-v} ;;
            *) v=ci-$(git rev-parse --short=10 HEAD) ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "hakuX $v"

      # the pinned sources (linux-deps.json), fetched again when it changes
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: linux-deps-${{ hashFiles('tools/native/linux-deps.json') }}

      - name: Image
        run: docker build --tag hakux-linux --file tools/native/Dockerfile.linux tools/native

      # root in the container, the checkout the runner's: git is told it's safe
      - name: Build and check
        run: |
          docker run --rm --volume "$PWD:/src" --workdir /src \
            --env JOBS=4 --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0='*' \
            hakux-linux sh tools/native/linux-ci.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: hakux-${{ steps.version.outputs.version }}-aarch64
          path: |
            build/package/hakux-${{ steps.version.outputs.version }}-aarch64.tar.gz
            build/package/hakux-${{ steps.version.outputs.version }}-aarch64.tar.gz.sha256
          if-no-files-found: error

  # x86-64 Linux (#56): the core with the KVM backend and its tests, in the
  # same image built for amd64 (tools/native/linux-ci-x86_64.sh). Nothing is
  # packaged: releases are the aarch64 build's.
  build-x86_64:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: build/deps
          key: linux-deps-${{ hashFiles('tools/native/linux-deps.json') }}

      - name: Image
        run: docker build --tag hakux-linux --file tools/native/Dockerfile.linux tools/native

      # the KVM backend's guest CPU (#56): the runner's /dev/kvm, handed in
      - name: Build and check
        run: |
          docker run --rm --volume "$PWD:/src" --workdir /src --device /dev/kvm \
            --env JOBS=4 --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0='*' \
            hakux-linux sh tools/native/linux-ci-x86_64.sh

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/linux-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: hakux-${{ needs.build.outputs.version }}-aarch64
          path: dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'linux-v*' --exclude "$GITHUB_REF_NAME" "$GITHUB_SHA" 2>/dev/null || true)
          python3 tools/native/linux-release-notes.py "$VERSION" "$GITHUB_SHA" "$previous" "$RUN_URL" > notes.md
          title="hakuX $VERSION for PortareOS (Linux, aarch64)"
          case "$VERSION" in
            *-exp*) title="$title — experimental" ;;
          esac
          case "$VERSION" in
            *-*) set -- --prerelease --latest=false ;;
            *) set -- --latest ;;
          esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$title" --notes-file notes.md "$@"
          fi
