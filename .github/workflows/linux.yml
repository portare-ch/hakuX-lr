# Run the buildbot job scripts in their pinned images.
name: Libretro platform preflight

on:
  push:
    branches: [ci/libretro-arm64-preflight]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86-64
            runner: ubuntu-24.04
            job: libretro-build-linux-x64
            machine: 62
          - platform: Linux AArch64
            runner: ubuntu-24.04-arm
            job: libretro-build-linux-aarch64
            machine: 183
          - platform: Android ARM64
            runner: ubuntu-24.04
            job: android-arm64-v8a
            machine: 183
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e0ad2db8616fc1c50ca8cd8cdb0001f9bc71d475
      - name: Run the GitLab job commands
        env:
          PREFLIGHT_JOB: ${{ matrix.job }}
          PREFLIGHT_MACHINE: ${{ matrix.machine }}
        run: |
          if ! python3 -c 'import yaml' >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y python3-yaml
          fi
          python3 - <<'PY'
          from os import environ
          from pathlib import Path
          from string import Template
          from struct import unpack_from
          from subprocess import check_output, run
          import yaml

          pipeline = yaml.load(Path(".gitlab-ci.yml").read_text(), Loader=yaml.BaseLoader)

          def effective_job(name):
              result = {}
              source = pipeline[name]
              parents = source.get("extends", [])
              if isinstance(parents, str):
                  parents = [parents]
              for definition in [*(effective_job(p) for p in parents if p in pipeline), source]:
                  variables = result.get("variables", {}) | definition.get("variables", {})
                  result.update(definition)
                  result["variables"] = variables
              return result

          def run_job(name):
              job = effective_job(name)
              environment = {
                  "CI_PROJECT_DIR": "/src",
                  "CI_COMMIT_SHORT_SHA": check_output(["git", "rev-parse", "--short=8", "HEAD"], text=True).strip(),
                  "GIT_CONFIG_COUNT": "1",
                  "GIT_CONFIG_KEY_0": "safe.directory",
                  "GIT_CONFIG_VALUE_0": "/src",
              }
              for key, value in job.get("variables", {}).items():
                  environment[key] = Template(value).substitute(environment)
              docker = ["docker", "run", "--rm", "--volume", f"{Path.cwd()}:/src", "--workdir", "/src"]
              for key, value in environment.items():
                  docker.extend(["--env", f"{key}={value}"])
              script = "\n".join(["test ! -e /dev/kvm", *job["before_script"], *job["script"]])
              print(f"Running {name} in {job['image']}", flush=True)
              run([*docker, job["image"], "bash", "-ex", "-c", script], check=True)
              return job

          name = environ["PREFLIGHT_JOB"]
          if name == "libretro-build-linux-x64":
              run_job("prepare-linux-x64-sysroot")
          job = run_job(name)

          [artifact] = job["artifacts"]["paths"]
          core = Path(artifact).read_bytes()
          assert core[:6] == b"\x7fELF\x02\x01"
          assert unpack_from("<HH", core, 16) == (3, int(environ["PREFLIGHT_MACHINE"]))
          if name.startswith("libretro-build-linux-"):
              cache = Path("build/libretro-linux/CMakeCache.txt").read_text()
              assert f"HAKUX_CPU:STRING={job['variables']['HAKUX_CPU']}" in cache
              assert "HAKUX_DSP_JIT:BOOL=ON" in cache
              assert "HAKUX_BUILD_TESTS:BOOL=OFF" in cache
              assert "HAKUX_LR_END_PROCESS:BOOL=OFF" in cache
          else:
              libraries = check_output(["readelf", "-d", artifact], text=True)
              assert "libc++_shared.so" not in libraries, libraries
          print(f"PASS: {artifact} built and verified")
          PY
