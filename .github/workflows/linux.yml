# The Linux libretro core (aarch64 and x86-64) is built and tested in the
# pinned image on pushes and PRs. Release tags and nightly runs also build
# the Android ARM64 core with NDK r29 and publish all three packages.
# Versioned releases use CHANGELOG.md for their notes. Nightly builds and
# versions with a suffix are published as prereleases.
# A pull request from this repository's own branches has its push's run; one
# from a fork is built on its own.
name: Linux

on:
  push:
    branches: ['**']
    tags: ['linux-v*']
  pull_request:
  schedule:
    - cron: '17 3 * * *'
      timezone: Europe/Zurich
  workflow_dispatch:
    inputs:
      nightly:
        description: Publish today's nightly from the default branch
        type: boolean
        default: false

concurrency:
  group: linux-${{ (github.event_name == 'schedule' || inputs.nightly) && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !inputs.nightly && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  version:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ github.event_name == 'schedule' || (inputs.nightly && github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch') }}
        run: |
          tag=
          if [ "$NIGHTLY" = true ]; then
            # A rerun keeps the date of the original run.
            created_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
            version=nightly-$(TZ=Europe/Zurich date --date="$created_at" +%F)
            tag=$version
          elif [[ "$GITHUB_REF" == refs/tags/linux-v* ]]; then
            tag=$GITHUB_REF_NAME
            version=${tag#linux-v}
          else
            version=ci-$(git rev-parse --short=10 HEAD)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # the pinned sources (linux-deps.json), fetched again when it changes
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: linux-deps-${{ hashFiles('tools/native/linux-deps.json') }}

      - name: Image
        run: docker build --tag hakux-lr-linux --file tools/native/Dockerfile.linux tools/native

      # root in the container, the checkout the runner's: git is told it's safe
      - name: Build and check
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run --rm --volume "$PWD:/src" --workdir /src \
            --env JOBS=4 --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0='*' \
            hakux-lr-linux sh tools/native/linux-ci.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: hakux-lr-${{ needs.version.outputs.version }}-aarch64
          path: |
            build/package/hakux-lr-${{ needs.version.outputs.version }}-aarch64.tar.gz
            build/package/hakux-lr-${{ needs.version.outputs.version }}-aarch64.tar.gz.sha256
          if-no-files-found: error

  # Build and test the x86-64 KVM core and DSP JIT in the amd64 image.
  build-x86_64:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: build/deps
          key: linux-deps-${{ hashFiles('tools/native/linux-deps.json') }}

      - name: Image
        run: docker build --tag hakux-lr-linux --file tools/native/Dockerfile.linux tools/native

      # the KVM backend's guest CPU (#56): the runner's /dev/kvm, handed in
      - name: Build and check
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run --rm --volume "$PWD:/src" --workdir /src --device /dev/kvm \
            --env JOBS=4 --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0='*' \
            hakux-lr-linux sh tools/native/linux-ci-x86_64.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: hakux-lr-${{ needs.version.outputs.version }}-x86_64
          path: |
            build/package/hakux-lr-${{ needs.version.outputs.version }}-x86_64.tar.gz
            build/package/hakux-lr-${{ needs.version.outputs.version }}-x86_64.tar.gz.sha256
          if-no-files-found: error

  # Experimental Android core for RetroArch: build with the pinned NDK r29.
  # Build Android for releases only.
  build-android:
    needs: version
    if: needs.version.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: build/deps
          key: linux-deps-${{ hashFiles('tools/native/linux-deps.json') }}

      - name: Fetch pinned dependencies
        run: python3 tools/native/linux-deps.py

      - name: Build Android ARM64 core
        env:
          ANDROID_NDK: /usr/local/lib/android/sdk/ndk/29.0.14206865
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          JOBS=4 sh tools/native/android-libretro.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: hakux-lr-${{ needs.version.outputs.version }}-android-arm64
          path: |
            build/package/hakux-lr-${{ needs.version.outputs.version }}-android-arm64.zip
            build/package/hakux-lr-${{ needs.version.outputs.version }}-android-arm64.zip.sha256
          if-no-files-found: error

  release:
    needs: [version, build, build-x86_64, build-android]
    if: needs.version.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: hakux-lr-${{ needs.version.outputs.version }}-*
          merge-multiple: true
          path: dist

      - name: Versioned release
        if: startsWith(needs.version.outputs.release_tag, 'linux-v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'linux-v*' --exclude "$GITHUB_REF_NAME" "$GITHUB_SHA" 2>/dev/null || true)
          python3 tools/native/linux-release-notes.py "$VERSION" "$GITHUB_SHA" "$previous" "$RUN_URL" > notes.md
          title="hakuX-lr $VERSION"
          case "$VERSION" in
            *-exp*) title="$title — experimental" ;;
          esac
          case "$VERSION" in
            *-*) set -- --prerelease --latest=false ;;
            *) set -- --latest ;;
          esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$title" --notes-file notes.md "$@"
          fi

      - name: Nightly prerelease
        if: startsWith(needs.version.outputs.release_tag, 'nightly-')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.release_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if state=$(gh release view "$TAG" --json isDraft,targetCommitish --jq 'if .isDraft then .targetCommitish else "published" end'); then
            if [ "$state" = published ]; then
              exit 0
            fi
            if [ "$state" != "$GITHUB_SHA" ]; then
              echo "The $TAG draft belongs to a different commit. Rerun its original workflow." >&2
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            printf 'Nightly build for Linux ARM64, Linux x86-64, and Android ARM64.\n\nBuilt from [%s](%s/%s/commit/%s) by [CI](%s).\n' \
              "${GITHUB_SHA:0:10}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$RUN_URL" > notes.md
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "hakuX-lr Nightly ${TAG#nightly-}" \
              --notes-file notes.md --prerelease --latest=false
          fi
