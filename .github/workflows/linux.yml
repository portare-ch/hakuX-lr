name: hakuX-lr release v0.35.1
on:
  push:
    branches: ['release/publish-v0.35.1']

concurrency:
  group: hakux-lr-release-v0.35.1
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_VERSION: '0.35.1'
  RELEASE_TAG: linux-v0.35.1
  RELEASE_COMMIT: 9fecf759cb24834ec228cc13ed42193d61baab81
  ARM_BUILD_RUN: '44474617967'

jobs:
  build-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}

      - uses: actions/cache@v4
        with:
          path: build/deps
          key: linux-deps-${{ hashFiles('tools/native/linux-deps.json') }}

      - name: Image
        run: |
          dockerfile="$RUNNER_TEMP/Dockerfile.hakux-lr"
          python3 - "$dockerfile" <<'PY'
          from pathlib import Path
          import sys

          dockerfile = Path("tools/native/Dockerfile.linux").read_text()
          apt_install = "RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends"
          if dockerfile.count(apt_install) != 1:
              raise SystemExit("Expected a single apt setup for the Ubuntu sysroot")

          mirror = """RUN printf '%s\\n' \\
              'deb http://azure.archive.ubuntu.com/ubuntu/ jammy main' \\
              'deb http://azure.archive.ubuntu.com/ubuntu/ jammy-updates main' \\
              'deb http://azure.archive.ubuntu.com/ubuntu/ jammy-security main' \\
              > /etc/apt/sources.list \\
              && apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update \\
              && DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends"""
          Path(sys.argv[1]).write_text(dockerfile.replace(apt_install, mirror))
          PY
          docker build --tag hakux-lr-linux --file "$dockerfile" tools/native

      - name: Build and check
        run: |
          docker run --rm --volume "$PWD:/src" --workdir /src --device /dev/kvm \
            --env JOBS=4 --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0='*' \
            hakux-lr-linux sh tools/native/linux-ci-x86_64.sh "$RELEASE_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: hakux-lr-${{ env.RELEASE_VERSION }}-x86_64
          path: |
            build/package/hakux-lr-${{ env.RELEASE_VERSION }}-x86_64.tar.gz
            build/package/hakux-lr-${{ env.RELEASE_VERSION }}-x86_64.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [build-x86_64]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}

      - uses: actions/download-artifact@v4
        with:
          name: hakux-lr-${{ env.RELEASE_VERSION }}-x86_64
          path: dist

      # These two packages passed in the previous run from RELEASE_COMMIT.
      - uses: actions/download-artifact@v4
        with:
          name: hakux-lr-${{ env.RELEASE_VERSION }}-aarch64
          run-id: ${{ env.ARM_BUILD_RUN }}
          github-token: ${{ github.token }}
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: hakux-lr-${{ env.RELEASE_VERSION }}-android-arm64
          run-id: ${{ env.ARM_BUILD_RUN }}
          github-token: ${{ github.token }}
          path: dist

      - name: Verify archives and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          name="hakux-lr-$RELEASE_VERSION"
          expected_source="source $RELEASE_COMMIT (https://github.com/portare-ch/hakuX-lr)"
          for arch in aarch64 x86_64; do
            archive="dist/$name-$arch.tar.gz"
            test -s "$archive.sha256"
            tar -xOzf "$archive" "$name/BUILD-INFO" | grep -Fx "$expected_source"
          done
          test -s "dist/$name-android-arm64.zip.sha256"
          unzip -p "dist/$name-android-arm64.zip" "$name-android-arm64/BUILD-INFO" | grep -Fx "$expected_source"
          set -- dist/*
          test "$#" -eq 6
          (cd dist && sha256sum --check --strict *.sha256)
          test -z "$(git ls-remote origin "refs/tags/$RELEASE_TAG")"
          python3 tools/native/linux-release-notes.py "$RELEASE_VERSION" "$RELEASE_COMMIT" linux-v0.35.0 "$RUN_URL" > notes.md
          gh release create "$RELEASE_TAG" "$@" --target "$RELEASE_COMMIT" \
            --title "hakuX-lr $RELEASE_VERSION" --notes-file notes.md --latest
